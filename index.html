    <!-- Fix for environments where window.fetch has only a getter -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          console.warn('Fetch shim warning:', err);
        }
      })();
    </script>
